name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Check project files
        run: |
          for f in build.gradle settings.gradle gradle.properties src/main/resources/fabric.mod.json src/main/resources/ezvisuals.mixins.json; do
            test -f "$f" || { echo "MISSING FILE IN REPO: $f"; find . -path ./.git -prune -o -type f -print | head -80; exit 1; }
          done

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ezvisuals-jar
          path: |
            build/libs/ezvisuals-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
